name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check build
        run: cargo check --all-targets
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Ensure the trigger never links GUI libraries
        run: |
          cargo build --release --bin seltrans-trigger
          if ldd target/release/seltrans-trigger | grep -Ei 'gtk|adwaita|gdk'; then
            echo "::error::seltrans-trigger must stay GUI-free by construction"
            ldd target/release/seltrans-trigger
            exit 1
          fi
